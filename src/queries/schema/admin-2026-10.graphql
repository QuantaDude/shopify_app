type QueryRoot {
  shop: Shop!
  products(after: String, before: String, first: Int, last: Int, query: String): ProductConnection!
  orders(after: String, before: String, first: Int, last: Int, query: String): OrderConnection!
  customers(after: String, before: String, first: Int, last: Int, query: String): CustomerConnection!
  taxonomy: Taxonomy!
  appByKey(apiKey: String!): App
  locations(first: Int, after: String, last: Int, before: String, includeInactive: Boolean, includeLegacy: Boolean, query: String, reverse: Boolean): LocationConnection!
}

type MutationRoot {
  appSubscriptionCreate(lineItems: [AppSubscriptionLineItemInput!]!, name: String!, returnUrl: URL!, test: Boolean, trialDays: Int): AppSubscriptionCreatePayload!
  productCreate(product: ProductCreateInput): ProductCreatePayload!
  productVariantsBulkCreate(productId: ID!, variants: [ProductVariantsBulkInput!]!): ProductVariantsBulkCreatePayload!
  webhookSubscriptionCreate(topic: WebhookSubscriptionTopic!, webhookSubscription: WebhookSubscriptionInput!): WebhookSubscriptionCreatePayload!
}

type UserError { field: [String!]! message: String! }
type AppSubscriptionCreatePayload { appSubscription: AppSubscription confirmationUrl: URL userErrors: [UserError!]! }
type ProductCreatePayload { product: Product userErrors: [UserError!]! }
type ProductVariantsBulkCreatePayload { productVariants: [ProductVariant!]! userErrors: [UserError!]! }
type WebhookSubscriptionCreatePayload { webhookSubscription: WebhookSubscription userErrors: [UserError!]! }

schema { query: QueryRoot mutation: MutationRoot }

