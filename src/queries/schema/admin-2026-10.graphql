# Curated subset of the Shopify Admin GraphQL API - version 2026-10
# Reconstructed from the official reference pages at shopify.dev
# (the public SDL proxy endpoint was decommissioned).
# Covers the types used by this app's operations; extend as needed.
# For the full schema, dump introspection from a store endpoint instead:
#   schema: https://<shop>.myshopify.com/admin/api/2026-10/graphql.json

scalar DateTime
scalar HTML
scalar URL
scalar Decimal
scalar JsonString
scalar MoneyBigDecimal
scalar Money
scalar CustomerEmailMarketingConsentState
scalar CustomerSmsMarketingConsentState
scalar UnsignedInt64

enum CurrencyCode { USD }
enum AppRecurringPricingInterval { DAY MONTH YEAR }
enum WebhookSubscriptionFormat { JSON }
enum ProductStatus { ACTIVE ARCHIVED DRAFT }
enum FulfillmentStatus { CANCELLED ERROR FAILURE OPEN PENDING SUCCESS }
enum AppSubscriptionStatus { ACCEPTED ACTIVE CANCELLED DECLINED EXPIRED PENDING }
enum OrderCancelReason { CUSTOMER DECLINED FRAUD INVENTORY OTHER }
enum OrderDisplayFinancialStatus { AUTHORIZED PAID PARTIALLY_PAID PENDING REFUNDED VOIDED }
enum FulfillmentDisplayStatus { BEFORE ATTEMPTING_DELIVERY CONFIRMED DELIVERED FAILURE FULFILLED IN_TRANSIT LABEL_PRINTED READY_FOR_PICKUP SCHEDULED SUBMITTED UNFULFILLED }
# CountryCode is truncated here to a representative subset; the field
# is only selected as a leaf by this app's documents.
enum CountryCode { AD AE AG AI AL AM AO AR AT AU AW AZ BB BE BF BG BH BI BJ BL BM BN BO BR BS BT BW BY BZ CA CD CG CH CI CL CM CN CO CR CU CV CW CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FM FO FR GA GD GE GF GG GH GI GL GM GN GP GQ GR GT GU GW GY HK HN HR HT HU ID IE IL IM IN IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MO MQ MR MT MU MV MW MX MY MZ NA NC NE NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PR PS PT PW PY QA RE RO RS RU RW SA SB SC SE SG SI SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TG TH TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VG VI VN VU WS XI YE ZA ZM ZW }
enum WebhookSubscriptionTopic {
  APP_UNINSTALLED
  APP_SUBSCRIPTIONS_UPDATE
  CUSTOMERS_CREATE
  ORDERS_CREATE
  ORDERS_UPDATED
  PRODUCTS_CREATE
  PRODUCTS_DELETE
  PRODUCTS_UPDATE
  SHOP_UPDATE
  SUBSCRIPTION_BILLING_ATTEMPTS_SUCCESS
}

type MoneyV2 { amount: Decimal! currencyCode: CurrencyCode! }
type Count { count: Int! }
type PageInfo { hasNextPage: Boolean! hasPreviousPage: Boolean! startCursor: String endCursor: String }
