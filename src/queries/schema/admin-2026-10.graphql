type ProductOptionValue { id: ID! name: String! hasVariants: Boolean! }
type SelectedOption { name: String! value: String! }
type ProductPriceRangeV2 { minVariantPrice: MoneyV2! maxVariantPrice: MoneyV2! }
type ProductCompareAtPriceRange { minVariantCompareAtPrice: MoneyV2! maxVariantCompareAtPrice: MoneyV2! }
type FulfillmentTrackingInfo { company: String number: String url: URL }

interface AppPricingDetails { interval: AppRecurringPricingInterval! }
type AppRecurringPricing implements AppPricingDetails { interval: AppRecurringPricingInterval! price: AppPricingPrice! }
type AppUsagePricing implements AppPricingDetails { interval: AppRecurringPricingInterval! cappedAmount: Decimal! }

