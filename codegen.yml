schema:
  - https://shopify.dev/admin-graphql-direct-proxy/2026-10:
      assumeValid: true

documents: './src/queries/*.graphql'

generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      preResolveTypes: true
      scalars:
        DateTime: string
        HTML: string
        URL: string
        Decimal: number 
        Money: string
        UnsignedInt64: number 
        JsonString: unknown
        MoneyBigDecimal: string
